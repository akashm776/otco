experiment:
  name: cub200_frozen_clip_vit_b32_geometry
  mode: frozen_geometry_diagnostic
  condition: historical_scaled_logit_ot
  purpose: determine whether pretrained CLIP contains structured CUB neighborhoods worth testing with OTCO

dataset:
  backend: hf_cub200
  dataset_name: alkzar90/CC6204-Hackaton-Cub-Dataset
  train_split: train
  val_split: test

model:
  backend: clip
  checkpoint: openai/clip-vit-base-patch32

# This is a held-out, class-balanced portion of the official training split.
# Preserve diagnostic_holdout_indices.json and exclude these IDs from later
# fine-tuning if its observations are used to choose thresholds.
sampling:
  source_split: train
  holdout_fraction: 0.20
  max_samples: 1024
  seed: 42
  caption_view: canonical_first_caption

runtime:
  device: cuda
  require_cuda: true
  min_vram_mib: 14000
  batch_size: 64
  num_workers: 2

# These are the current OTCO transport settings, not tuned CLIP values. A fresh
# full-pool plan is built once; there is no cached/stale training plan here.
ot:
  solver: historical_sparse_ot
  cost_space: clip_scaled_logits
  top_k: 32
  ot_eps: 0.7
  sinkhorn_iters: 30
  exclude_same_image_positives: true

# Historical ResNet/DistilBERT thresholds are reported only as overlays. They
# do not suppress examples or affect model parameters in this diagnostic.
historical_threshold_overlay:
  gate_sim: -4.0
  entropy_threshold: 3.0
  gap_suppress_easy: 0.10
  gap_downweight_hard: -0.07

output:
  directory: outputs/cub200_frozen_clip_vit_b32_geometry
  representative_examples_per_group: 5
