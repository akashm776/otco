experiment:
  name: cub200_frozen_clip_vit_b32_geometry_v2
  mode: frozen_geometry_diagnostic_v2
  purpose: test scale-controlled OT and actual batch-local gate semantics before CLIP fine-tuning

dataset:
  backend: hf_cub200
  dataset_name: alkzar90/CC6204-Hackaton-Cub-Dataset
  train_split: train
  val_split: test

model:
  backend: clip
  checkpoint: openai/clip-vit-base-patch32

# Identical selection procedure to V1. The emitted holdout file must remain
# excluded from later training if these diagnostics guide parameter choices.
sampling:
  source_split: train
  holdout_fraction: 0.20
  max_samples: 1024
  seed: 42
  caption_view: canonical_first_caption

runtime:
  device: cuda
  require_cuda: true
  min_vram_mib: 14000
  batch_size: 64
  num_workers: 2

transport_variants:
  historical_scaled_logit_ot:
    solver: historical_sparse_ot
    cost_space: clip_scaled_logits
    top_k: 32
    ot_eps: 0.7
    sinkhorn_iters: 30
    include_in_batch_emulation: true

  matched_scaled_logit_ot:
    solver: historical_sparse_ot
    cost_space: clip_scaled_logits
    top_k: 32
    ot_eps: 4.9
    sinkhorn_iters: 30
    include_in_batch_emulation: true

  raw_cosine_ot:
    solver: historical_sparse_ot
    cost_space: raw_cosine
    top_k: 32
    ot_eps: 0.049
    sinkhorn_iters: 30
    include_in_batch_emulation: true

  # Diagnostic-only mathematical comparison. It is not wired into training.
  corrected_matched_scaled_logit_ot:
    solver: support_preserving_sparse_ot
    cost_space: clip_scaled_logits
    top_k: 32
    ot_eps: 4.9
    sinkhorn_iters: 300
    include_in_batch_emulation: false

historical_thresholds:
  gate_sim: -4.0
  entropy_threshold: 3.0
  gap_suppress_easy: 0.10
  gap_downweight_hard: -0.07
  hard_alpha_scale: 0.25

batch_emulation:
  batch_size: 64
  num_batches: 200
  seed: 4242
  scheduled_alpha: 0.05

species_evaluation:
  prompt_template: "a photo of a {species_name}"
  batch_size: 64

output:
  directory: outputs/cub200_frozen_clip_vit_b32_geometry_v2
