experiment:
  name: cub200_frozen_clip_vit_b32_support_breadth_ablation
  mode: frozen_support_breadth_ablation
  purpose: isolate whether OT weighting compensates for broad B64 top-k support

dataset:
  backend: hf_cub200
  dataset_name: alkzar90/CC6204-Hackaton-Cub-Dataset
  train_split: train
  val_split: test

model:
  backend: clip
  checkpoint: openai/clip-vit-base-patch32

sampling:
  source_split: train
  holdout_indices_path: configs/cub200_clip_diagnostic_holdout_indices.json
  holdout_size: 1024
  seed: 42
  caption_view: canonical_first_caption

runtime:
  device: cuda
  require_cuda: true
  min_vram_mib: 14000
  batch_size: 64
  num_workers: 2

batch_emulation:
  batch_size: 64
  num_batches: 200
  seed: 4242

ot:
  solver: historical_sparse_ot
  cost_space: raw_cosine
  ot_eps: 0.049
  sinkhorn_iters: 30
  exclude_same_image_positives: true
  k_values: [2, 4, 8, 16, 32]

comparison:
  tie_tolerance: 0.000001
  bootstrap_seed: 42
  bootstrap_samples: 10000

output:
  directory: outputs/cub200_frozen_clip_vit_b32_support_breadth_ablation
